name: clock

# The only thing that runs this repo. Four schedules and a manual dispatch,
# all funnelled through jobs/run.mjs, which maps the incoming cron string (or
# the dispatch input) to a job module.
#
# Concurrency is keyed on the schedule, not on the workflow, so a slow poll
# tick can never overlap the next poll tick while still letting source and
# touch run alongside it.

on:
  schedule:
    - cron: '*/20 8-20 * * 1-5'   # poll
    - cron: '0 14 * * 1-5'        # touch
    - cron: '0 13 * * 1'          # source, then qualify
    - cron: '30 13 * * 1-5'       # personalize
  workflow_dispatch:
    inputs:
      job:
        description: Job to run by name
        required: true
        type: string

concurrency:
  group: clock-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # the source run commits the heartbeat file
      id-token: write   # OIDC exchange for the GCP workload identity provider
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: pnpm install --frozen-lockfile

      # lib/claude.mjs shells out to the `claude` binary — it is not a repo
      # dependency and ubuntu-latest does not ship it. qualify, personalize
      # and poll all fail without this step.
      - name: Install the Claude Code CLI
        run: npm i -g @anthropic-ai/claude-code

      # ~/os, for the skills the jobs shell out to (/pitch, /quote) and the
      # voice rules personalize reads. bcns-os is private and the bcn-services
      # org disables deploy keys, so this clones over a fine-grained PAT.
      # Gated on `vars.OS_REPO`, not the secret — the `secrets` context is not
      # available in a step-level `if`. Unset the variable and OS_DIR simply
      # never appears, and every job falls back to what it carries itself.
      - name: Check out ~/os
        if: vars.OS_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.OS_REPO }}
          token: ${{ secrets.OS_TOKEN }}
          path: os
          persist-credentials: false

      # The skills the jobs shell out to only load from ~/.claude/skills, so
      # the clone is symlinked into place. The identity is set inside the
      # clone alone: nothing here ever commits to this repo's main.
      - name: Wire ~/os skills and git identity
        if: vars.OS_REPO != ''
        env:
          OS_DIR: ${{ github.workspace }}/os
        run: |
          mkdir -p ~/.claude
          ln -sfn "$OS_DIR/skills" ~/.claude/skills
          git -C "$OS_DIR" config user.name 'bcns bot'
          git -C "$OS_DIR" config user.email 'bot@bcn-services.com'

      # Keyless: no service account key exists, and none can be created —
      # the org enforces iam.managed.disableServiceAccountKeyCreation.
      # Skipped when the vars are unset so the workflow still parses and runs
      # before anyone configures GCP.
      - name: Authenticate to Google Cloud
        id: auth
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Run job
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Envelope sender for the RCPT TO probe qualify runs on a
          # discovered address. No sender, no probe — never a guess.
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          # The auth action returns the minted token as a step output, not an
          # env var; a token here is proof the OIDC exchange actually ran.
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          # Always set. The clone is optional, so a job tests for the
          # directory rather than trusting the variable.
          OS_DIR: ${{ github.workspace }}/os
          # Sending. No SMTP_PASS means the touch job simply has no transport.
          # DRY_RUN is unset here on purpose: it defaults to on, and Nate flips
          # the repo variable himself when he is ready for a real send.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          # Two lists, never one. SEND_ gates which PROSPECTS touch may mail;
          # NOTIFY_ gates which internal humans get forwards and whose replies
          # are obeyed as commands. Unset is nobody, so both stay empty until a
          # human sets the repo variable.
          SEND_ALLOWED_RECIPIENTS: ${{ vars.SEND_ALLOWED_RECIPIENTS }}
          NOTIFY_ALLOWED_RECIPIENTS: ${{ vars.NOTIFY_ALLOWED_RECIPIENTS }}
          DRY_RUN: ${{ vars.DRY_RUN }}
          SCHEDULE: ${{ github.event.schedule }}
          JOB: ${{ inputs.job }}
        run: pnpm job

      # GitHub disables schedules on a repo with sixty days of no activity.
      # The weekly source run commits a dated file so that clock never expires.
      - name: Commit heartbeat
        if: github.event.schedule == '0 13 * * 1'
        run: |
          git config user.name 'bcns-clock'
          git config user.email 'bcns-clock@users.noreply.github.com'
          git add outputs/heartbeat
          git diff --cached --quiet || git commit -m 'chore: heartbeat'
          git push
