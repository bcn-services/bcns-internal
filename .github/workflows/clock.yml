name: clock

# The only thing that runs this repo. Four schedules and a manual dispatch,
# all funnelled through jobs/run.mjs, which maps the incoming cron string (or
# the dispatch input) to a job module.
#
# GitHub's own `schedule` event is best-effort and on this repo it drops most
# ticks (six landed of thirty-nine on 2026-09-04). The crons below stay as a
# backup; the reliable trigger is Cloud Scheduler in the GCP project posting a
# workflow_dispatch with `schedule` set to the same cron string, so the
# SCHEDULES map in jobs/run.mjs stays the single source of truth for what runs.
# See docs/SCHEDULER.md.
#
# Concurrency is keyed on the schedule, not on the workflow, so a slow poll
# tick can never overlap the next poll tick while still letting source and
# touch run alongside it.

on:
  schedule:
    - cron: '*/20 8-20 * * 1-5'   # poll
    - cron: '0 14 * * 1-5'        # touch
    - cron: '0 13 * * 1'          # source, then qualify
    - cron: '30 13 * * 1-5'       # personalize
  workflow_dispatch:
    inputs:
      schedule:
        description: Cron string from SCHEDULES to run as a tick (what Cloud Scheduler sends)
        required: false
        type: string
      job:
        description: Job to run by name (manual; overrides schedule)
        required: false
        type: string

concurrency:
  group: clock-${{ github.event.schedule || inputs.schedule || inputs.job }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # the source run commits the heartbeat file
      id-token: write   # OIDC exchange for the GCP workload identity provider
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: pnpm install --frozen-lockfile

      # lib/claude.mjs shells out to the `claude` binary — it is not a repo
      # dependency and ubuntu-latest does not ship it. qualify, personalize
      # and poll all fail without this step.
      - name: Install the Claude Code CLI
        run: npm i -g @anthropic-ai/claude-code

      # Prove the CLI can answer before a job spends its tick on it. Prints
      # only the exit code and the envelope — never the token.
      - name: Claude CLI smoke test
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude --version
          claude -p 'reply with the single word ok' --model sonnet --output-format json < /dev/null || echo "claude exit $?"

      # ~/os, for the skills the jobs shell out to (/pitch, /quote) and the
      # voice rules personalize reads. bcns-os is private and the bcn-services
      # org disables deploy keys, so this clones over a fine-grained PAT.
      # Gated on `vars.OS_REPO`, not the secret — the `secrets` context is not
      # available in a step-level `if`. Unset the variable and OS_DIR simply
      # never appears, and every job falls back to what it carries itself.
      - name: Check out ~/os
        if: vars.OS_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.OS_REPO }}
          token: ${{ secrets.OS_TOKEN }}
          path: os
          # Kept: pitch/quote/onboard push their folders back with this token.
          persist-credentials: true

      # The skills the jobs shell out to only load from ~/.claude/skills, so
      # the clone is symlinked into place. The identity is set inside the
      # clone alone: nothing here ever commits to this repo's main.
      - name: Wire ~/os skills and git identity
        if: vars.OS_REPO != ''
        env:
          OS_DIR: ${{ github.workspace }}/os
        run: |
          mkdir -p ~/.claude
          ln -sfn "$OS_DIR/skills" ~/.claude/skills
          git -C "$OS_DIR" config user.name 'bcns bot'
          git -C "$OS_DIR" config user.email 'bot@bcn-services.com'

      # Keyless: no service account key exists, and none can be created —
      # the org enforces iam.managed.disableServiceAccountKeyCreation.
      # Skipped when the vars are unset so the workflow still parses and runs
      # before anyone configures GCP.
      - name: Authenticate to Google Cloud
        id: auth
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Run job
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Envelope sender for the RCPT TO probe qualify runs on a
          # discovered address. No sender, no probe — never a guess.
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          # The auth action returns the minted token as a step output, not an
          # env var; a token here is proof the OIDC exchange actually ran.
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          # Always set. The clone is optional, so a job tests for the
          # directory rather than trusting the variable.
          OS_DIR: ${{ github.workspace }}/os
          # Sending. No SMTP_PASS means the touch job simply has no transport.
          # DRY_RUN is unset here on purpose: it defaults to on, and Nate flips
          # the repo variable himself when he is ready for a real send.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          # The seat that owns the app password; SMTP_USER is a send-as alias.
          SMTP_AUTH_USER: ${{ secrets.SMTP_AUTH_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          # Second outreach domain (migration 0025): its own Workspace org and
          # seat, so cold mail never authenticates through the bcn-services
          # account. Keyed per item 22 (SMTP) and item 23 (IMAP).
          SMTP_MAILBOX_OUTREACH_TRYBCNS_COM_USER: ${{ secrets.SMTP_MAILBOX_OUTREACH_TRYBCNS_COM_USER }}
          SMTP_MAILBOX_OUTREACH_TRYBCNS_COM_PASS: ${{ secrets.SMTP_MAILBOX_OUTREACH_TRYBCNS_COM_PASS }}
          IMAP_MAILBOX_OUTREACH_TRYBCNS_COM_USER: ${{ secrets.IMAP_MAILBOX_OUTREACH_TRYBCNS_COM_USER }}
          IMAP_MAILBOX_OUTREACH_TRYBCNS_COM_PASS: ${{ secrets.IMAP_MAILBOX_OUTREACH_TRYBCNS_COM_PASS }}
          # Polling. Same app password as SMTP; no IMAP_PASS means poll skips.
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          # Onboard creates the client repo under bcn-services with `gh`.
          GH_TOKEN: ${{ secrets.OS_TOKEN }}
          # /new-client-repo's preflight: a classic PAT with read:packages so the
          # new client repo's `pnpm install` can reach GitHub Packages. gh itself
          # keeps using GH_TOKEN, which wins over GITHUB_TOKEN.
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          # Fit one run inside the job timeout: touch spreads its sends over
          # this window, and the skill jobs take at most this many rows a tick.
          JITTER_WINDOW_MS: '180000'
          SKILL_JOB_LIMIT: '3'
          # Two lists, never one. SEND_ gates which PROSPECTS touch may mail;
          # NOTIFY_ gates which internal humans get forwards and whose replies
          # are obeyed as commands. Unset is nobody, so both stay empty until a
          # human sets the repo variable.
          SEND_ALLOWED_RECIPIENTS: ${{ vars.SEND_ALLOWED_RECIPIENTS }}
          NOTIFY_ALLOWED_RECIPIENTS: ${{ vars.NOTIFY_ALLOWED_RECIPIENTS }}
          # The single human who gets the onboarded/signed handover mail.
          # Separate from NOTIFY_ALLOWED_RECIPIENTS on purpose — see notify.mjs.
          ONBOARD_NOTIFY_TO: ${{ vars.ONBOARD_NOTIFY_TO }}
          DRY_RUN: ${{ vars.DRY_RUN }}
          # Alert triage (item 24-26): fallback repo for an unmapped alert,
          # `name=org/repo,...` overrides, and the alias poll routes to
          # triage (defaults to alerts@bcn-services.com when unset). The
          # fixer clones and pushes with GH_TOKEN above.
          ALERT_REPO: ${{ vars.ALERT_REPO }}
          ALERT_REPO_MAP: ${{ vars.ALERT_REPO_MAP }}
          ALERTS_ADDRESS: ${{ vars.ALERTS_ADDRESS }}
          # A Cloud Scheduler dispatch carries the cron string as an input;
          # GitHub's own cron carries it on the event. Same key either way.
          SCHEDULE: ${{ github.event.schedule || inputs.schedule }}
          JOB: ${{ inputs.job }}
        run: pnpm job

      # GitHub disables schedules on a repo with sixty days of no activity.
      # The weekly source run commits a dated file so that clock never expires.
      - name: Commit heartbeat
        if: (github.event.schedule || inputs.schedule) == '0 13 * * 1' || inputs.job == 'heartbeat'
        run: |
          git config user.name 'bcns-clock'
          git config user.email 'bcns-clock@users.noreply.github.com'
          # The dir only exists once the heartbeat job wrote it; a tick that
          # skipped the job must not go red here.
          [ -d outputs/heartbeat ] || { echo 'no heartbeat file to commit'; exit 0; }
          git add outputs/heartbeat
          git diff --cached --quiet || git commit -m 'chore: heartbeat'
          git push
